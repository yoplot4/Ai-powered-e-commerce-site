<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redo — Brand Guidelines</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #111111;
      background-color: #ffffff;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =======================================
       SIDEBAR NAVIGATION
       ======================================= */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background-color: #ffffff;
      border-right: 1px solid #e2e2e2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    /* Top Logo Section */
    .sidebar-header {
      padding: 24px 28px;
      border-bottom: 1px solid #e2e2e2;
    }

    .brand-logo-small {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 1.1rem;
      text-decoration: none;
      color: #000000;
      letter-spacing: -0.03em;
    }

    .brand-logo-small svg {
      width: 18px;
      height: 18px;
      stroke: #000000;
      stroke-width: 2.5;
      fill: none;
    }

    /* Navigation Menu */
    .sidebar-nav {
      flex-grow: 1;
      padding: 30px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-item {
      text-decoration: none;
      color: #111111;
      font-size: 0.92rem;
      font-weight: 600;
      display: flex;
      align-items: flex-start;
      transition: opacity 0.2s;
    }

    .nav-item:hover {
      opacity: 0.6;
    }

    .nav-item.active {
      font-weight: 700;
    }

    .nav-item sup {
      font-size: 0.62rem;
      color: #888888;
      margin-left: 2px;
      font-weight: 400;
    }

    /* Bottom Sidebar Links */
    .sidebar-footer {
      padding: 28px;
      border-top: 1px solid #e2e2e2;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer-link {
      text-decoration: none;
      color: #777777;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .footer-link:hover {
      color: #000000;
    }

    /* =======================================
       MAIN CONTENT CONTAINER
       ======================================= */
    .main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    /* Mesh Gradient Hero Box */
    .hero-banner {
      width: 100%;
      height: 480px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Soft sky blue, warm yellow, and vibrant orange mesh gradient */
      background: 
        radial-gradient(circle at 10% 15%, rgba(180, 210, 230, 0.9) 0%, transparent 45%),
        radial-gradient(circle at 95% 65%, rgba(245, 95, 30, 0.95) 0%, transparent 55%),
        radial-gradient(circle at 50% 40%, rgba(255, 195, 75, 1) 0%, transparent 50%),
        linear-gradient(135deg, #a8c8db 0%, #f7a048 50%, #ee5622 100%);
    }

    /* Subtle texture overlay for mesh feel */
    .hero-banner::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.12;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Centered Large Redo Logo */
    .hero-logo {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #ffffff;
      z-index: 1;
    }

    .hero-logo svg {
      width: 64px;
      height: 64px;
      stroke: #ffffff;
      stroke-width: 8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero-logo h1 {
      font-size: 4.8rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    /* Description Section Below Hero */
    .content-body {
      padding: 60px 80px;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 40px;
      max-width: 1200px;
    }

    .content-title {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .content-description {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #555555;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }
      .content-body {
        grid-template-columns: 1fr;
        padding: 40px 24px;
      }
      .hero-logo h1 {
        font-size: 3.2rem;
      }
      .hero-logo svg {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar Navigation -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="#" class="brand-logo-small">
        <svg viewBox="0 0 24 24">
          <path d="M9 14l-4-4 4-4" />
          <path d="M5 10h11a4 4 0 0 1 0 8h-1" />
        </svg>
        Redo
      </a>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active">Brand Strategy<sup>01</sup></a>
      <a href="#" class="nav-item">Personality<sup>02</sup></a>
      <a href="#" class="nav-item">Logo<sup>03</sup></a>
      <a href="#" class="nav-item">Color<sup>04</sup></a>
      <a href="#" class="nav-item">Typography<sup>05</sup></a>
      <a href="#" class="nav-item">Art Direction<sup>06</sup></a>
    </nav>

    <div class="sidebar-footer">
      <a href="#" class="footer-link">Download Kit</a>
      <a href="#" class="footer-link">Contact Us</a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    
    <!-- Hero Mesh Gradient Banner -->
    <section class="hero-banner">
      <div class="hero-logo">
        <svg viewBox="0 0 100 100">
          <path d="M40 60 L18 38 L40 16" />
          <path d="M18 38 L68 38 C80 38 88 48 88 60 C88 72 80 80 68 80 L52 80" />
        </svg>
        <h1>Redo</h1>
      </div>
    </section>

    <!-- Page Content below Banner -->
    <section class="content-body">
      <h2 class="content-title">Brand</h2>
      <p class="content-description">
        This guide defines the visual language, design style, and principles 
        that shape a clear and consistent brand experience, no matter the medium or channel.
      </p>
    </section>

  </main>

</body>
</html>
